<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard | Yaswanth</title>
  <style>
    :root { color-scheme: dark; --bg:#090e1c; --panel:#151d31; --muted:#9ba9c5; --accent:#7c9cff; --line:#293653; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; padding:32px 18px; font-family:Inter,Segoe UI,Arial,sans-serif; color:#f5f7ff; background:radial-gradient(circle at 15% 5%,#1c2c57 0,transparent 32%),linear-gradient(135deg,#080d19,#101a30); }
    .wrap { max-width:1000px; margin:auto; }
    header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:28px; }
    .brand { font-weight:800; letter-spacing:.4px; } .brand span { color:var(--accent); }
    .back { color:#cbd6f2; text-decoration:none; border:1px solid var(--line); padding:9px 13px; border-radius:12px; }
    h1 { font-size:clamp(2rem,5vw,3.2rem); margin:0 0 8px; }
    .sub { color:var(--muted); margin:0 0 24px; }
    .search { display:flex; gap:10px; margin-bottom:18px; }
    input { flex:1; min-width:0; padding:15px 16px; border-radius:14px; border:1px solid var(--line); background:#111a2d; color:white; font-size:1rem; outline:none; }
    input:focus { border-color:var(--accent); }
    button { border:0; border-radius:14px; padding:0 22px; background:var(--accent); color:#081126; font-weight:800; cursor:pointer; }
    button:hover { filter:brightness(1.1); }
    .status { color:var(--muted); min-height:24px; margin:8px 2px 16px; }
    .grid { display:grid; grid-template-columns:1.2fr .8fr; gap:16px; }
    .card { background:linear-gradient(145deg,rgba(25,36,61,.96),rgba(16,25,44,.96)); border:1px solid var(--line); border-radius:22px; padding:24px; box-shadow:0 18px 50px #0003; }
    .current { min-height:280px; display:flex; flex-direction:column; justify-content:space-between; }
    .place { color:var(--muted); font-size:1rem; }
    .main-weather { display:flex; align-items:center; gap:20px; margin:16px 0; }
    .emoji { font-size:4.4rem; line-height:1; }
    .temp { font-size:clamp(3.5rem,9vw,5rem); font-weight:800; letter-spacing:-4px; }
    .desc { color:#c6d2ef; font-size:1.1rem; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .stat { background:#ffffff08; border:1px solid #ffffff0d; padding:13px; border-radius:14px; }
    .stat small { display:block; color:var(--muted); margin-bottom:7px; }
    .stat strong { font-size:1.05rem; }
    h2 { font-size:1.1rem; margin:0 0 18px; }
    .forecast { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
    .day { text-align:center; padding:15px 8px; border-radius:15px; background:#ffffff08; }
    .day small { display:block; color:var(--muted); }
    .day .ico { font-size:1.7rem; margin:10px 0; }
    .day strong { display:block; font-size:.95rem; }
    footer { color:var(--muted); font-size:.85rem; text-align:center; margin-top:22px; }
    @media(max-width:700px) { .grid { grid-template-columns:1fr; } .forecast { grid-template-columns:repeat(2,1fr); } .search { flex-direction:column; } button { padding:14px; } .stats { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="brand">yaswanth<span>.dev</span> / weather</div>
      <a class="back" href="index.html">← Portfolio</a>
    </header>
    <h1>Weather Dashboard</h1>
    <p class="sub">Live weather conditions and a 5-day forecast for your city.</p>
    <form class="search" id="searchForm">
      <input id="cityInput" type="text" placeholder="Enter a city, e.g. Vijayawada" value="Vijayawada" aria-label="City name">
      <button type="submit">Search city</button>
    </form>
    <p class="status" id="status" role="status">Loading weather…</p>
    <section class="grid" aria-live="polite">
      <article class="card current">
        <div>
          <div class="place" id="place">—</div>
          <div class="main-weather">
            <div class="emoji" id="icon">🌤️</div>
            <div><div class="temp"><span id="temperature">--</span>°</div><div class="desc" id="description">—</div></div>
          </div>
        </div>
        <div class="stats">
          <div class="stat"><small>Feels like</small><strong id="feels">--°</strong></div>
          <div class="stat"><small>Humidity</small><strong id="humidity">--%</strong></div>
          <div class="stat"><small>Wind</small><strong id="wind">-- km/h</strong></div>
        </div>
      </article>
      <article class="card">
        <h2>5-day forecast</h2>
        <div class="forecast" id="forecast">
          <div class="day"><small>—</small><div class="ico">⛅</div><strong>--°</strong></div>
        </div>
      </article>
    </section>
    <footer>Weather data by Open-Meteo · Built with HTML, CSS and JavaScript</footer>
  </main>
<script>
const $ = (id) => document.getElementById(id);
const weatherInfo = (code) => {
  if (code === 0) return ["Clear sky", "☀️"];
  if ([1,2].includes(code)) return ["Partly cloudy", "🌤️"];
  if (code === 3) return ["Overcast", "☁️"];
  if ([45,48].includes(code)) return ["Foggy", "🌫️"];
  if ([51,53,55,56,57].includes(code)) return ["Drizzle", "🌦️"];
  if ([61,63,65,66,67,80,81,82].includes(code)) return ["Rain", "🌧️"];
  if ([71,73,75,77,85,86].includes(code)) return ["Snow", "❄️"];
  if ([95,96,99].includes(code)) return ["Thunderstorm", "⛈️"];
  return ["Mixed conditions", "🌡️"];
};
async function loadWeather(city) {
  $("status").textContent = "Finding " + city + "…";
  try {
    const geoRes = await fetch("https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(city) + "&count=1&language=en&format=json");
    if (!geoRes.ok) throw new Error("Could not reach the location service.");
    const geo = await geoRes.json();
    if (!geo.results || !geo.results.length) throw new Error("City not found. Check the spelling and try again.");
    const loc = geo.results[0];
    $("status").textContent = "Loading live conditions…";
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=5`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("Weather data is temporarily unavailable.");
    const data = await res.json();
    const current = data.current;
    const [label, icon] = weatherInfo(current.weather_code);
    $("place").textContent = [loc.name, loc.admin1, loc.country].filter(Boolean).join(", ");
    $("icon").textContent = icon;
    $("temperature").textContent = Math.round(current.temperature_2m);
    $("description").textContent = label;
    $("feels").textContent = Math.round(current.apparent_temperature) + "°";
    $("humidity").textContent = current.relative_humidity_2m + "%";
    $("wind").textContent = Math.round(current.wind_speed_10m) + " km/h";
    $("forecast").innerHTML = data.daily.time.map((date, i) => {
      const [desc, dayIcon] = weatherInfo(data.daily.weather_code[i]);
      const day = new Date(date + "T12:00:00").toLocaleDateString("en", { weekday:"short" });
      return `<div class="day"><small>${day}</small><div class="ico" title="${desc}">${dayIcon}</div><strong>${Math.round(data.daily.temperature_2m_max[i])}°</strong><small>${Math.round(data.daily.temperature_2m_min[i])}° low</small></div>`;
    }).join("");
    $("status").textContent = "Updated just now · Times shown in local time";
  } catch (error) {
    $("status").textContent = error.message + " Check your internet connection and try again.";
  }
}
$("searchForm").addEventListener("submit", (event) => {
  event.preventDefault();
  const city = $("cityInput").value.trim();
  if (city) loadWeather(city);
});
loadWeather($("cityInput").value);
</script>
</body>
</html>
